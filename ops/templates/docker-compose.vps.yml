services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik:/letsencrypt
    networks:
      - edge

  postgresdb:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Asia/Almaty
      PGTZ: Asia/Almaty
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql_custom_config/pg_hba.conf
      - -c
      - timezone=Asia/Almaty
    ports:
      - "${PG_TAILSCALE_BIND_IP:-${PG_BIND_IP:-127.0.0.1}}:5432:5432"
    volumes:
      - ./data/postgres/main:/var/lib/postgresql/data
      - ./config/postgres/pg_hba.conf:/etc/postgresql_custom_config/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - back
      - host_access

  hasura_metadata_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HASURA_MD_DB}
      POSTGRES_USER: ${HASURA_MD_USER}
      POSTGRES_PASSWORD: ${HASURA_MD_PASSWORD}
      TZ: Asia/Almaty
      PGTZ: Asia/Almaty
    volumes:
      - ./data/postgres/hasura_md:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HASURA_MD_USER} -d ${HASURA_MD_DB}"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    networks:
      - back

  valkey:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - back

  hasura:
    image: hasura/graphql-engine:v2.40.0
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: ${HASURA_GRAPHQL_DATABASE_URL}
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://${HASURA_MD_USER}:${HASURA_MD_PASSWORD}@hasura_metadata_db:5432/${HASURA_MD_DB}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_ENABLE_CONSOLE:-false}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_JWT_SECRET: |
        {
          "type": "HS256",
          "key": "${HASURA_JWT_SECRET}"
        }
      HASURA_GRAPHQL_LOG_LEVEL: ${HASURA_LOG_LEVEL:-info}
      HASURA_GRAPHQL_CORS_DOMAIN: ${HASURA_GRAPHQL_CORS_DOMAIN}
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: ${HASURA_ENABLED_LOG_TYPES:-startup,http-log,webhook-log,websocket-log,query-log}
    depends_on:
      hasura_metadata_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 25s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${EDGE_NETWORK_NAME:-erp_edge}
      - traefik.http.routers.hasura.rule=Host(`${HASURA_FQDN}`)
      - traefik.http.routers.hasura.entrypoints=websecure
      - traefik.http.routers.hasura.tls.certresolver=letsencrypt
      - traefik.http.services.hasura.loadbalancer.server.port=8080
    networks:
      - back
      - edge

  backend:
    build:
      context: ${BACKEND_BUILD_CONTEXT:-./backend}
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      ERP_STACK_ENV: ${ERP_STACK_ENV:-test}
      APP_NAME: ${BACKEND_APP_NAME:-erp-backend}
      API_PREFIX: /api/v1
      PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: "true"
      TRUST_PROXY: "true"
      SWAGGER_ENABLED: ${BACKEND_SWAGGER_ENABLED:-false}
      READINESS_REQUIRE_DATABASE: "true"
      READINESS_REQUIRE_REDIS: ${READINESS_REQUIRE_REDIS:-true}
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgresdb:5432/${PG_DB}
      DATABASE_SSL: "false"
      BACKEND_RATE_LIMIT_STORE: ${BACKEND_RATE_LIMIT_STORE:-redis}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://valkey:6379}
      JWT_ACCESS_SECRET: ${HASURA_JWT_SECRET}
      REFRESH_TOKEN_PEPPER: ${BACKEND_REFRESH_TOKEN_PEPPER}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-36000}
      REFRESH_COOKIE_SECURE: "true"
      REFRESH_COOKIE_SAME_SITE: none
      BACKEND_ENABLE_AUTH: ${BACKEND_ENABLE_AUTH:-true}
      BACKEND_ENABLE_ORDERS: ${BACKEND_ENABLE_ORDERS:-true}
      BACKEND_ENABLE_PAYMENTS: ${BACKEND_ENABLE_PAYMENTS:-true}
      BACKEND_ENABLE_PRODUCTION_ACTIONS: ${BACKEND_ENABLE_PRODUCTION_ACTIONS:-false}
      BACKEND_ENABLE_CLIENT_PHONES: ${BACKEND_ENABLE_CLIENT_PHONES:-false}
      BACKEND_ORDERS_READ_ONLY: ${BACKEND_ORDERS_READ_ONLY:-false}
      BACKEND_ENABLE_USERS: ${BACKEND_ENABLE_USERS:-true}
      BACKEND_ENABLE_ORDER_EXPORT: ${BACKEND_ENABLE_ORDER_EXPORT:-true}
      BACKEND_EXPORT_DISABLED: ${BACKEND_EXPORT_DISABLED:-true}
      GAS_WEBAPP_URL: ${GAS_WEBAPP_URL:-}
      GAS_API_KEY: ${GAS_API_KEY:-}
      GAS_EXPORT_TIMEOUT_MS: ${GAS_EXPORT_TIMEOUT_MS:-55000}
      BACKEND_ENABLE_VLM: ${BACKEND_ENABLE_VLM:-true}
      BACKEND_VLM_DISABLED: ${BACKEND_VLM_DISABLED:-true}
      BACKEND_ENABLE_GROUPS: ${BACKEND_ENABLE_GROUPS:-false}
      BACKEND_GROUPS_READ_ONLY: ${BACKEND_GROUPS_READ_ONLY:-true}
      BACKEND_ENABLE_GROUPS_BATCH_LINK_WRITE: ${BACKEND_ENABLE_GROUPS_BATCH_LINK_WRITE:-false}
      BACKEND_ENABLE_GROUP_P8_NOTIFICATIONS: ${BACKEND_ENABLE_GROUP_P8_NOTIFICATIONS:-false}
      BACKEND_ENABLE_ORG_MANAGEMENT: ${BACKEND_ENABLE_ORG_MANAGEMENT:-false}
      BACKEND_ORG_MANAGEMENT_READ_ONLY: ${BACKEND_ORG_MANAGEMENT_READ_ONLY:-true}
      VLM_API_URL: ${VLM_API_URL:-}
      VLM_HEALTH_TIMEOUT_MS: ${VLM_HEALTH_TIMEOUT_MS:-10000}
      VLM_UPLOAD_TIMEOUT_MS: ${VLM_UPLOAD_TIMEOUT_MS:-30000}
      VLM_ANALYZE_TIMEOUT_MS: ${VLM_ANALYZE_TIMEOUT_MS:-90000}
      VLM_ANALYZE_DAILY_LIMIT: ${VLM_ANALYZE_DAILY_LIMIT:-100}
      VLM_MAX_UPLOAD_MB: ${VLM_MAX_UPLOAD_MB:-20}
      VLM_ALLOWED_MIME_TYPES: ${VLM_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
      AUTH0_M2M_DOMAIN: ${AUTH0_M2M_DOMAIN:-}
      AUTH0_M2M_CLIENT_ID: ${AUTH0_M2M_CLIENT_ID:-}
      AUTH0_M2M_CLIENT_SECRET: ${AUTH0_M2M_CLIENT_SECRET:-}
      AUTH0_M2M_AUDIENCE: ${AUTH0_M2M_AUDIENCE:-}
      BACKEND_ENABLE_DEADLINES: ${BACKEND_ENABLE_DEADLINES:-false}
      BACKEND_ENABLE_DEADLINE_ORDER_SYNC: ${BACKEND_ENABLE_DEADLINE_ORDER_SYNC:-false}
      BACKEND_DEADLINES_READ_ONLY: ${BACKEND_DEADLINES_READ_ONLY:-true}
      BACKEND_ENABLE_DEADLINE_WORKER: ${BACKEND_ENABLE_DEADLINE_WORKER:-false}
      BACKEND_DEADLINE_WORKER_SCHEDULER_OWNER: ${BACKEND_DEADLINE_WORKER_SCHEDULER_OWNER:-none}
      BACKEND_DEADLINE_WORKER_POLL_INTERVAL_MS: ${BACKEND_DEADLINE_WORKER_POLL_INTERVAL_MS:-60000}
      BACKEND_DEADLINE_WORKER_BATCH_SIZE: ${BACKEND_DEADLINE_WORKER_BATCH_SIZE:-100}
      BACKEND_DEADLINE_WORKER_ID: ${BACKEND_DEADLINE_WORKER_ID:-backend-local}
      BACKEND_DEADLINE_ACTIONS_ENABLED: ${BACKEND_DEADLINE_ACTIONS_ENABLED:-false}
      BACKEND_DEADLINE_NOTIFICATIONS_ENABLED: ${BACKEND_DEADLINE_NOTIFICATIONS_ENABLED:-false}
      BACKEND_ENABLE_NOTIFICATION_ENGINE: ${BACKEND_ENABLE_NOTIFICATION_ENGINE:-false}
      BACKEND_NOTIFICATION_RULES_READ_ONLY: ${BACKEND_NOTIFICATION_RULES_READ_ONLY:-true}
      BACKEND_NOTIFICATION_ENGINE_OWNS_DEADLINE: ${BACKEND_NOTIFICATION_ENGINE_OWNS_DEADLINE:-false}
      BACKEND_OUTBOX_RELAY_OWNER: ${BACKEND_OUTBOX_RELAY_OWNER:-none}
      BACKEND_OUTBOX_RELAY_POLL_INTERVAL_MS: ${BACKEND_OUTBOX_RELAY_POLL_INTERVAL_MS:-60000}
      BACKEND_OUTBOX_RELAY_BATCH_SIZE: ${BACKEND_OUTBOX_RELAY_BATCH_SIZE:-100}
      BACKEND_OUTBOX_RELAY_WORKER_ID: ${BACKEND_OUTBOX_RELAY_WORKER_ID:-backend-local}
      BACKEND_OUTBOX_RELAY_MAX_ATTEMPTS: ${BACKEND_OUTBOX_RELAY_MAX_ATTEMPTS:-10}
      BACKEND_ENABLE_TELEGRAM_NOTIFICATIONS: ${BACKEND_ENABLE_TELEGRAM_NOTIFICATIONS:-false}
      TELEGRAM_NOTIFICATION_BOT_TOKEN: ${TELEGRAM_NOTIFICATION_BOT_TOKEN:-}
      TELEGRAM_NOTIFICATION_BOT_USERNAME: ${TELEGRAM_NOTIFICATION_BOT_USERNAME:-}
      TELEGRAM_NOTIFICATION_WEBHOOK_SECRET: ${TELEGRAM_NOTIFICATION_WEBHOOK_SECRET:-}
      TELEGRAM_NOTIFICATION_API_BASE: ${TELEGRAM_NOTIFICATION_API_BASE:-https://api.telegram.org}
      TELEGRAM_NOTIFICATION_REQUEST_TIMEOUT_MS: ${TELEGRAM_NOTIFICATION_REQUEST_TIMEOUT_MS:-10000}
      TELEGRAM_NOTIFICATION_LINK_TTL_SECONDS: ${TELEGRAM_NOTIFICATION_LINK_TTL_SECONDS:-600}
      BACKEND_TELEGRAM_NOTIFICATION_RELAY_OWNER: ${BACKEND_TELEGRAM_NOTIFICATION_RELAY_OWNER:-none}
      BACKEND_TELEGRAM_NOTIFICATION_RELAY_POLL_INTERVAL_MS: ${BACKEND_TELEGRAM_NOTIFICATION_RELAY_POLL_INTERVAL_MS:-10000}
      BACKEND_TELEGRAM_NOTIFICATION_RELAY_BATCH_SIZE: ${BACKEND_TELEGRAM_NOTIFICATION_RELAY_BATCH_SIZE:-50}
      BACKEND_TELEGRAM_NOTIFICATION_RELAY_WORKER_ID: ${BACKEND_TELEGRAM_NOTIFICATION_RELAY_WORKER_ID:-telegram-notifications-local}
      BACKEND_TELEGRAM_NOTIFICATION_RELAY_MAX_ATTEMPTS: ${BACKEND_TELEGRAM_NOTIFICATION_RELAY_MAX_ATTEMPTS:-10}
      BACKEND_TELEGRAM_NOTIFICATION_RELAY_STALE_LOCK_MS: ${BACKEND_TELEGRAM_NOTIFICATION_RELAY_STALE_LOCK_MS:-600000}
      BACKEND_ENABLE_SHEET_MATERIALS: ${BACKEND_ENABLE_SHEET_MATERIALS:-false}
      BACKEND_SHEET_ORDERS_READS: ${BACKEND_SHEET_ORDERS_READS:-false}
      BACKEND_ENABLE_CUT_JOBS: ${BACKEND_ENABLE_CUT_JOBS:-false}
      BACKEND_ENABLE_CNC_TELEGRAM: ${BACKEND_ENABLE_CNC_TELEGRAM:-false}
      CNC_TELEGRAM_WORKER_USERNAME: ${CNC_TELEGRAM_WORKER_USERNAME:-${ERP_WORKER_LOGIN:-}}
      CNC_TELEGRAM_ALLOWED_CHAT_IDS: ${CNC_TELEGRAM_ALLOWED_CHAT_IDS:-${TELEGRAM_ALLOWED_CHAT_ID:-}}
      CNC_TELEGRAM_MEDIA_DIR: ${CNC_TELEGRAM_MEDIA_DIR:-/data/cnc-telegram-media}
      BACKEND_ENABLE_DOWELING_COMMANDS: ${BACKEND_ENABLE_DOWELING_COMMANDS:-false}
      BACKEND_ENABLE_LABELS: ${BACKEND_ENABLE_LABELS:-false}
      LABEL_TELEGRAM_CUT_MAP_FALLBACK_ENABLED: ${LABEL_TELEGRAM_CUT_MAP_FALLBACK_ENABLED:-false}
      BACKEND_ENABLE_BAZIS: ${BACKEND_ENABLE_BAZIS:-false}
      BACKEND_ENABLE_BAZIS_CUT: ${BACKEND_ENABLE_BAZIS_CUT:-false}
      BACKEND_ENABLE_ORDER_LIVE_SNAPSHOT: ${BACKEND_ENABLE_ORDER_LIVE_SNAPSHOT:-false}
      BACKEND_ENABLE_ORDER_REALTIME_WRITES: ${BACKEND_ENABLE_ORDER_REALTIME_WRITES:-false}
      BACKEND_ENABLE_ORDER_REALTIME_STREAM: ${BACKEND_ENABLE_ORDER_REALTIME_STREAM:-false}
      BACKEND_PERFORMANCE_QUERY_TELEMETRY: ${BACKEND_PERFORMANCE_QUERY_TELEMETRY:-false}
      BACKEND_ENABLE_PERFORMANCE_RUM: ${BACKEND_ENABLE_PERFORMANCE_RUM:-false}
      BACKEND_ORDER_REALTIME_HEARTBEAT_MS: ${BACKEND_ORDER_REALTIME_HEARTBEAT_MS:-20000}
      BACKEND_ORDER_REALTIME_CATCHUP_MS: ${BACKEND_ORDER_REALTIME_CATCHUP_MS:-1000}
      BACKEND_ORDER_REALTIME_RETENTION_HOURS: ${BACKEND_ORDER_REALTIME_RETENTION_HOURS:-24}
      BACKEND_ORDER_REALTIME_MAX_CONNECTIONS: ${BACKEND_ORDER_REALTIME_MAX_CONNECTIONS:-500}
      BACKEND_ORDER_REALTIME_MAX_CONNECTIONS_PER_USER: ${BACKEND_ORDER_REALTIME_MAX_CONNECTIONS_PER_USER:-3}
      BACKEND_ORDER_REALTIME_MAX_QUEUE_EVENTS: ${BACKEND_ORDER_REALTIME_MAX_QUEUE_EVENTS:-250}
      BACKEND_ORDER_REALTIME_MAX_DETAIL_IDS: ${BACKEND_ORDER_REALTIME_MAX_DETAIL_IDS:-500}
      BACKEND_STATUS_AUTOMATION: ${BACKEND_STATUS_AUTOMATION:-false}
      BACKEND_ENABLE_WORKOS_AUTH: ${BACKEND_ENABLE_WORKOS_AUTH:-false}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-}
      BACKEND_CUT_JOBS_READ_ONLY: ${BACKEND_CUT_JOBS_READ_ONLY:-true}
      BACKEND_CUT_AUTO_TRIGGER: ${BACKEND_CUT_AUTO_TRIGGER:-false}
      BACKEND_CUT_NATIVE_PORTRAIT: ${BACKEND_CUT_NATIVE_PORTRAIT:-false}
      FREECUT_BASE_URL: ${FREECUT_BASE_URL:-}
      FREECUT_OPTIMIZE_TIMEOUT_MS: ${FREECUT_OPTIMIZE_TIMEOUT_MS:-15000}
      BACKEND_CUT_HEURISTIC_AUTO_THRESHOLD: ${BACKEND_CUT_HEURISTIC_AUTO_THRESHOLD:-100}
      # CAD SVG/DXF service over the internal "back" network. Backend calls it
      # by service DNS and skips the token (trusted Docker CIDR).
      CAD_SERVICE_BASE_URL: ${CAD_SERVICE_BASE_URL:-http://cad-service:8000}
      OCR_SERVICE_BASE_URL: ${OCR_SERVICE_BASE_URL:-http://ocr-service:8000}
      CAD_SERVICE_API_TOKEN: ${CAD_SERVICE_API_TOKEN:-}
      # Bitrix24 one-way CRM projection — default OFF and fail-closed.
      BACKEND_ENABLE_BITRIX24_SYNC: ${BACKEND_ENABLE_BITRIX24_SYNC:-false}
      BACKEND_BITRIX24_SYNC_RELAY_OWNER: ${BACKEND_BITRIX24_SYNC_RELAY_OWNER:-none}
      BACKEND_BITRIX24_SYNC_DRY_RUN: ${BACKEND_BITRIX24_SYNC_DRY_RUN:-false}
      BACKEND_BITRIX24_SYNC_POLL_INTERVAL_MS: ${BACKEND_BITRIX24_SYNC_POLL_INTERVAL_MS:-60000}
      BACKEND_BITRIX24_SYNC_BATCH_SIZE: ${BACKEND_BITRIX24_SYNC_BATCH_SIZE:-100}
      BACKEND_BITRIX24_SYNC_MAX_ATTEMPTS: ${BACKEND_BITRIX24_SYNC_MAX_ATTEMPTS:-10}
      BACKEND_BITRIX24_SYNC_WORKER_ID: ${BACKEND_BITRIX24_SYNC_WORKER_ID:-bitrix24-sync-local}
      BACKEND_BITRIX24_SYNC_LEASE_MS: ${BACKEND_BITRIX24_SYNC_LEASE_MS:-300000}
      BITRIX24_WEBHOOK_ALLOWED_HOST: ${BITRIX24_WEBHOOK_ALLOWED_HOST:-}
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
      BITRIX24_REQUEST_TIMEOUT_MS: ${BITRIX24_REQUEST_TIMEOUT_MS:-30000}
      BITRIX24_CURRENCY_ID: ${BITRIX24_CURRENCY_ID:-KZT}
      BITRIX24_PAY_SYSTEM_ID: ${BITRIX24_PAY_SYSTEM_ID:-}
      BITRIX24_ASSIGNED_BY_ID: ${BITRIX24_ASSIGNED_BY_ID:-}
    depends_on:
      postgresdb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${EDGE_NETWORK_NAME:-erp_edge}
      - traefik.http.routers.backend.rule=Host(`${BACKEND_FQDN}`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=3000
    volumes:
      - cnc-telegram-media:/data/cnc-telegram-media
    networks:
      - back
      - edge

  freecut:
    build:
      # Fixed path: deployment scripts verify this exact checkout immediately
      # before build. An override would allow stale, unverified source.
      context: ./repo_freecut
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8088"
    environment:
      PORT: "8088"
      RUST_LOG: ${FREECUT_RUST_LOG:-info}
      MAX_BODY_BYTES: ${FREECUT_MAX_BODY_BYTES:-5242880}
      MAX_INSTANCES: ${FREECUT_MAX_INSTANCES:-5000}
      DEFAULT_TIME_LIMIT_MS: ${FREECUT_DEFAULT_TIME_LIMIT_MS:-1200}
      DEFAULT_RESTARTS: ${FREECUT_DEFAULT_RESTARTS:-5}
      MAX_CONCURRENT_OPTIMIZE: ${FREECUT_MAX_CONCURRENT_OPTIMIZE:-1}
      # Must stay below the backend's FREECUT_OPTIMIZE_TIMEOUT_MS (15000):
      # otherwise the backend aborts while the request still holds the queue.
      OPTIMIZE_QUEUE_WAIT_MS: ${FREECUT_OPTIMIZE_QUEUE_WAIT_MS:-10000}
    cpus: ${FREECUT_CPUS:-1.5}
    mem_limit: ${FREECUT_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health/live || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - back

  ocr-service:
    build:
      context: ${OCR_BUILD_CONTEXT:-./repo_erp/ocr-service}
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    # ANTI-EXPOSURE: только внутренняя сеть back; НИКАКИХ ports/traefik/edge
    # (Codex-гейт scan-ocr плана; НЕ копировать паттерн cad-service ниже).
    networks:
      - back
    # Blast-radius isolation (final-review): CPU/mem/pids caps — OCR-инференс
    # CPU-тяжёлый и не должен голодить backend/hasura; лог-кэп против диска.
    cpus: ${OCR_CPUS:-1.0}
    mem_limit: ${OCR_MEM_LIMIT:-768m}
    pids_limit: ${OCR_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  glm-ocr-model-init:
    profiles: ["cnc-telegram-glm"]
    image: ${GLM_OCR_MODEL_INIT_IMAGE:-curlimages/curl:8.10.1}
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        if [ ! -s "/models/$${GLM_OCR_MODEL_FILE}" ]; then
          rm -f "/models/$${GLM_OCR_MODEL_FILE}.tmp"
          curl -fL --retry 5 --retry-delay 10 --connect-timeout 20 -o "/models/$${GLM_OCR_MODEL_FILE}.tmp" "$${GLM_OCR_MODEL_URL}"
          mv "/models/$${GLM_OCR_MODEL_FILE}.tmp" "/models/$${GLM_OCR_MODEL_FILE}"
        fi
        if [ ! -s "/models/$${GLM_OCR_MMPROJ_FILE}" ]; then
          rm -f "/models/$${GLM_OCR_MMPROJ_FILE}.tmp"
          curl -fL --retry 5 --retry-delay 10 --connect-timeout 20 -o "/models/$${GLM_OCR_MMPROJ_FILE}.tmp" "$${GLM_OCR_MMPROJ_URL}"
          mv "/models/$${GLM_OCR_MMPROJ_FILE}.tmp" "/models/$${GLM_OCR_MMPROJ_FILE}"
        fi
    environment:
      GLM_OCR_MODEL_URL: ${GLM_OCR_MODEL_URL:-https://huggingface.co/ggml-org/GLM-OCR-GGUF/resolve/main/GLM-OCR-Q8_0.gguf?download=true}
      GLM_OCR_MMPROJ_URL: ${GLM_OCR_MMPROJ_URL:-https://huggingface.co/ggml-org/GLM-OCR-GGUF/resolve/main/mmproj-GLM-OCR-Q8_0.gguf?download=true}
      GLM_OCR_MODEL_FILE: ${GLM_OCR_MODEL_FILE:-GLM-OCR-Q8_0.gguf}
      GLM_OCR_MMPROJ_FILE: ${GLM_OCR_MMPROJ_FILE:-mmproj-GLM-OCR-Q8_0.gguf}
    volumes:
      - glm-ocr-model-cache:/models
    networks:
      - host_access
    cpus: ${GLM_OCR_MODEL_INIT_CPUS:-1.0}
    mem_limit: ${GLM_OCR_MODEL_INIT_MEM_LIMIT:-256m}
    pids_limit: ${GLM_OCR_MODEL_INIT_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  glm-ocr-llama:
    profiles: ["cnc-telegram-glm"]
    image: ${GLM_OCR_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    depends_on:
      glm-ocr-model-init:
        condition: service_completed_successfully
    command:
      - --model
      - /models/${GLM_OCR_MODEL_FILE:-GLM-OCR-Q8_0.gguf}
      - --mmproj
      - /models/${GLM_OCR_MMPROJ_FILE:-mmproj-GLM-OCR-Q8_0.gguf}
      - --alias
      - ${GLM_OCR_MODEL_ALIAS:-glm-ocr}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - ${GLM_OCR_CTX_SIZE:-12000}
      - --parallel
      - ${GLM_OCR_PARALLEL:-1}
      - --threads
      - ${GLM_OCR_THREADS:-2}
      - --n-gpu-layers
      - "0"
      - --no-mmproj-offload
      - --flash-attn
      - "off"
    expose:
      - "8080"
    volumes:
      - glm-ocr-model-cache:/models:ro
    networks:
      - back
    cpus: ${GLM_OCR_LLAMA_CPUS:-2.0}
    mem_limit: ${GLM_OCR_LLAMA_MEM_LIMIT:-4096m}
    pids_limit: ${GLM_OCR_LLAMA_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  glm-ocr-runner:
    profiles: ["cnc-telegram-glm"]
    build:
      context: ${GLM_OCR_RUNNER_BUILD_CONTEXT:-./repo_erp/glm-ocr-runner}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      glm-ocr-llama:
        condition: service_started
    expose:
      - "8001"
    environment:
      LLAMA_SERVER_URL: ${LLAMA_SERVER_URL:-http://glm-ocr-llama:8080}
      GLM_OCR_MODEL_ALIAS: ${GLM_OCR_MODEL_ALIAS:-glm-ocr}
      GLM_OCR_TIMEOUT_SECONDS: ${GLM_OCR_TIMEOUT_SECONDS:-600}
      GLM_OCR_MAX_TOKENS: ${GLM_OCR_MAX_TOKENS:-2048}
      GLM_OCR_RESPONSE_FORMAT: ${GLM_OCR_RESPONSE_FORMAT:-false}
      GLM_OCR_MAX_IMAGE_BYTES: ${GLM_OCR_MAX_IMAGE_BYTES:-10485760}
      GLM_OCR_MAX_WAITING: ${GLM_OCR_MAX_WAITING:-2}
    networks:
      - back
    cpus: ${GLM_OCR_RUNNER_CPUS:-0.5}
    mem_limit: ${GLM_OCR_RUNNER_MEM_LIMIT:-512m}
    pids_limit: ${GLM_OCR_RUNNER_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s

  cnc-telegram-worker:
    profiles: ["cnc-telegram"]
    build:
      context: ${CNC_TELEGRAM_WORKER_BUILD_CONTEXT:-./repo_erp/cnc-telegram-worker}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ERP_STACK_ENV: ${ERP_STACK_ENV:-test}
      CNC_TELEGRAM_WORKER_ROLE: ${CNC_TELEGRAM_WORKER_ROLE:-reader}
      CNC_TELEGRAM_ALLOW_NON_PROD_WRITER: ${CNC_TELEGRAM_ALLOW_NON_PROD_WRITER:-false}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_PATH: ${TELEGRAM_SESSION_PATH:-/data/session/cnc_telegram}
      TELEGRAM_CHAT: ${TELEGRAM_CHAT:-}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:-}
      ERP_API_URL: ${CNC_TELEGRAM_ERP_API_URL:-http://backend:3000/api/v1}
      ERP_BEARER_TOKEN: ${ERP_BEARER_TOKEN:-}
      ERP_WORKER_LOGIN: ${ERP_WORKER_LOGIN:-}
      ERP_WORKER_PASSWORD: ${ERP_WORKER_PASSWORD:-}
      CNC_ENABLE_GLM_OCR: ${CNC_ENABLE_GLM_OCR:-false}
      CNC_OCR_COMMAND: ${CNC_OCR_COMMAND:-python -m cnc_telegram_worker.rapid_ocr_client --image {image}}
      CNC_OCR_COMMAND_TIMEOUT_SECONDS: ${CNC_OCR_COMMAND_TIMEOUT_SECONDS:-180}
      CNC_RAPID_OCR_URL: ${CNC_RAPID_OCR_URL:-http://ocr-service:8000/ocr}
      CNC_RAPID_OCR_TIMEOUT_SECONDS: ${CNC_RAPID_OCR_TIMEOUT_SECONDS:-120}
      GLM_OCR_RUNNER_URL: ${GLM_OCR_RUNNER_URL:-http://glm-ocr-runner:8001/ocr}
      GLM_OCR_CLIENT_TIMEOUT_SECONDS: ${GLM_OCR_CLIENT_TIMEOUT_SECONDS:-660}
      CNC_OCR_ENGINE: ${CNC_OCR_ENGINE:-rapidocr-ppocrv5-eslav}
      CNC_PARSER_VERSION: ${CNC_PARSER_VERSION:-cnc-telegram-worker-v14}
      CNC_MACHINE_DEFAULT: ${CNC_MACHINE_DEFAULT:-}
      CNC_DEFAULT_MATERIAL: ${CNC_DEFAULT_MATERIAL:-МДФ 16мм}
      CNC_BUSINESS_TIMEZONE: ${CNC_BUSINESS_TIMEZONE:-Asia/Almaty}
      CNC_HISTORY_DAYS: ${CNC_HISTORY_DAYS:-7}
      CNC_POLL_INTERVAL_SECONDS: ${CNC_POLL_INTERVAL_SECONDS:-60}
      CNC_TEMP_TTL_HOURS: ${CNC_TEMP_TTL_HOURS:-24}
      CNC_ATTACHMENT_TTL_HOURS: ${CNC_ATTACHMENT_TTL_HOURS:-720}
      CNC_MAX_MESSAGES_PER_SCAN: ${CNC_MAX_MESSAGES_PER_SCAN:-1000}
      CNC_TEMP_DIR: ${CNC_TEMP_DIR:-/data/tmp}
      CNC_MEDIA_DIR: ${CNC_MEDIA_DIR:-/data/cnc-telegram-media}
      CNC_STATE_PATH: ${CNC_STATE_PATH:-/data/state.json}
      CNC_AUDIT_SPOOL_PATH: ${CNC_AUDIT_SPOOL_PATH:-/data/cnc-telegram-audit.sqlite3}
      CNC_RESEND_UNCHANGED: ${CNC_RESEND_UNCHANGED:-false}
      CNC_BACKFILL_ON_START: ${CNC_BACKFILL_ON_START:-true}
    command: ["daemon"]
    volumes:
      - cnc-telegram-worker-data:/data
      - cnc-telegram-media:/data/cnc-telegram-media
    networks:
      - back
      - host_access
    cpus: ${CNC_TELEGRAM_WORKER_CPUS:-1.0}
    mem_limit: ${CNC_TELEGRAM_WORKER_MEM_LIMIT:-1024m}
    pids_limit: ${CNC_TELEGRAM_WORKER_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cad-service:
    build:
      context: ${CAD_BUILD_CONTEXT:-./repo_svgdxf}
      dockerfile: Dockerfile
    image: cad-service:local
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      CAD_SERVICE_API_TOKEN: ${CAD_SERVICE_API_TOKEN:-}
      CAD_SERVICE_TRUSTED_CIDRS: ${CAD_SERVICE_TRUSTED_CIDRS:-127.0.0.0/8,::1/128,172.16.0.0/12}
      # Public traffic arrives via traefik, so trust X-Forwarded-For: the real
      # external client IP is evaluated (not traefik's trusted Docker IP), which
      # keeps internal backend token-free while forcing a token for outside IPs.
      CAD_SERVICE_TRUST_PROXY_HEADERS: ${CAD_SERVICE_TRUST_PROXY_HEADERS:-1}
    volumes:
      - cad-data:/app/data
      - cad-generated:/app/generated
    # Blast-radius isolation: cap CPU/mem so a runaway render cannot starve the
    # host and take down sibling services; cap logs so it cannot fill the disk.
    cpus: ${CAD_CPUS:-1.0}
    mem_limit: ${CAD_MEM_LIMIT:-512m}
    pids_limit: ${CAD_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=${EDGE_NETWORK_NAME:-erp_edge}
      - traefik.http.routers.cad.rule=Host(`${CAD_FQDN}`)
      - traefik.http.routers.cad.entrypoints=websecure
      - traefik.http.routers.cad.tls.certresolver=letsencrypt
      - traefik.http.services.cad.loadbalancer.server.port=8000
      # Browser access to the built-in UI is gated at the edge with HTTP basic
      # auth (the UI itself sends no token); the app trusts the proxy so it does
      # not also demand a Bearer. Credentials live in CAD_BASICAUTH_USERS (.env).
      - traefik.http.routers.cad.middlewares=cad-auth
      - traefik.http.middlewares.cad-auth.basicauth.users=${CAD_BASICAUTH_USERS}
    networks:
      - back
      - edge

networks:
  edge:
    name: ${EDGE_NETWORK_NAME:-erp_edge}
    driver: bridge
  back:
    driver: bridge
    internal: true
  host_access:
    driver: bridge

volumes:
  valkey_data:
  cad-data:
  cad-generated:
  cnc-telegram-worker-data:
  cnc-telegram-media:
  glm-ocr-model-cache:
