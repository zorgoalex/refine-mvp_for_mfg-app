# Local sockets inside container
local   all             all                                     trust

# Loopback from the host
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Internal Docker networks
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256

# Tailscale tailnet range. Keep PG_BIND_IP restricted to a Tailscale IP if
# remote DB admin/restore access is required. Do not bind Postgres to 0.0.0.0
# unless you also harden this file and the VPS firewall.
host    all             all             100.64.0.0/10           scram-sha-256
