name: Backend Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/backend-erp-stage1
  push:
    branches:
      - main
      - feat/backend-erp-stage1

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: isolated-migration-test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install root test runner
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Typecheck backend production sources
        run: npm run typecheck --prefix backend

      # The backend test glob excludes ops/. Keep migration classification a
      # release gate so newly added SQL cannot silently miss the auto-mode map.
      - name: Verify migration runner contracts
        run: npx vitest run ops/apply-migrations.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Verify recent migration effects on disposable PostgreSQL
        env:
          ERP_MIGRATION_PROBE_INTEGRATION: 'true'
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: npx vitest run ops/apply-migrations-recent.integration.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Run backend tests from repository root
        run: >-
          npm run test:backend -- --maxWorkers=1 --no-file-parallelism
          --reporter=default --reporter=junit --outputFile=backend-test-results.xml

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-test-results.xml
          if-no-files-found: ignore
          retention-days: 7
