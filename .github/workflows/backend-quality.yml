name: Backend Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/backend-erp-stage1
  push:
    branches:
      - main
      - feat/backend-erp-stage1

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install root test runner
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Typecheck backend production sources
        run: npm run typecheck --prefix backend

      - name: Run backend tests from repository root
        run: >-
          npm run test:backend -- --maxWorkers=1 --no-file-parallelism
          --reporter=default --reporter=junit --outputFile=backend-test-results.xml

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-test-results.xml
          if-no-files-found: ignore
          retention-days: 7
