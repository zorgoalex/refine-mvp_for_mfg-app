    LogoutResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        providerLogoutUrl:
          type: string
          description: |
            Hosted-провайдерский logout URL (WorkOS). Присутствует только когда
            завершаемая сессия была создана через SSO; фронт делает redirect,
            чтобы погасить и сессию провайдера (best-effort).
        providerLogoutStatus:
          type: string
          enum: [redirect, unavailable, not_applicable]
          description: |
            Явный исход provider-logout: redirect — перейти по
            providerLogoutUrl; unavailable — сессия была SSO, но logout
            провайдера подготовить не удалось (сессия провайдера может быть
            жива — UI показывает предупреждение); not_applicable — обычная
            локальная сессия.

