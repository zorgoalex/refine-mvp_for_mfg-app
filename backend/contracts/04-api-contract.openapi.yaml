  /api/v1/cut-jobs/{cutJobId}/export.pdf:
    get:
      tags:
        - CutJobs
      operationId: exportCutJobPdf
      summary: Export a whole-job PDF (all groups; on-demand, cached, pre-warmed)
      security:
        - bearerAuth: []
      x-permission: cut.view
      parameters:
        - name: variant
          in: query
          required: false
          schema:
            type: string
            enum: [auto, manual, active]
            default: auto
          description: >-
            Which layout variant to render (auto = algorithm layout, active = whichever is marked
            active per group). Note: variant=manual is NOT supported on whole-job PDF export —
            manual layouts are per-group and cannot be applied job-wide; the server returns 422
            CUT_MANUAL_VARIANT_NOT_JOB_SCOPED if variant=manual is requested here. Default auto.
        - name: renderVersion
          in: query
          required: false
          schema:
            type: string
          description: Opaque cache-bust token; ignored by the server but forwarded by the browser to bypass stale cached responses after a manual layout is saved.
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '202':
          description: PDF render in progress (retry with Retry-After)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            A recalculation is required before PDF export (CUT_RECALC_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: >-
            Validation error or unsupported variant for this endpoint
            (CUT_MANUAL_VARIANT_NOT_JOB_SCOPED — variant=manual is not supported on the
            whole-job PDF; manual layouts are per-group. Use variant=auto or variant=active instead).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '503':
          $ref: '#/components/responses/FeatureDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

