      tags: [Bazis]
      operationId: updateBazisPdfTablePattern
      summary: Approve, reject, correct, or deactivate a Basis PDF layout
      security:
        - bearerAuth: []
      x-permission: bazis.manage
      parameters:
        - in: path
          name: fingerprint
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                approvalStatus: { type: string, enum: [approved, rejected] }
                isActive: { type: boolean }
                mapping: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated pattern }
