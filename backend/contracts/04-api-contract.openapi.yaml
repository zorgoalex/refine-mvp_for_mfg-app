openapi: 3.0.3
info:
  title: ERP/CRM Backend API
  version: 0.1.0
  description: |
    Контракт backend API для первого этапа внедрения NestJS backend-слоя.

    Backend является источником истины для авторизации, прав доступа, транзакционного
    сохранения заказов, финансовых расчётов, экспорта, VLM-интеграций и аудита.

    Frontend не должен напрямую управлять транзакциями заказа, refresh-token'ами,
    финансовыми итогами, экспортными payload'ами и проверкой прав доступа.

    Stage-1 backend API использует явное path versioning. Текущая стабильная
    версия: /api/v1. Неломающие поля можно добавлять в v1; breaking changes
    требуют /api/v2 и отдельного cutover/deprecation плана.

servers:
  - url: http://localhost:3000
    description: Local NestJS backend
  - url: https://api.example.com
    description: Production backend placeholder

tags:
  - name: Audit
    description: Журнал аудита событий системы
  - name: Auth
    description: Авторизация, refresh-сессии и текущий пользователь
  - name: Orders
    description: Заказы как бизнес-агрегат
  - name: Order Export
    description: Экспорт заказов во внешние системы
  - name: Payments
    description: Платежи заказа
  - name: Client Phones
    description: Телефоны клиентов
  - name: Production Actions
    description: Точечные производственные действия над заказом
  - name: Groups
    description: Groups API
  - name: Order Snapshots
    description: Экспорт и импорт переносимых snapshot'ов заказа
  - name: Deadlines
    description: Дедлайны, политики дедлайнов и настройки deadline automation
  - name: Notifications
    description: Persisted current-user notifications
  - name: Users
    description: Управление пользователями
  - name: VLM
    description: Загрузка изображений и VLM-анализ
  - name: Labels
    description: Bazis-compatible label templates and order label generation
  - name: Health
    description: Liveness/readiness проверки backend-сервиса

paths:
  /api/v1/audit:
    get:
      tags:
        - Audit
      operationId: listAuditLog
      summary: Список audit events
      description: Возвращает постраничный список audit log событий с фильтрами по actor, entity, related ids, action и времени. Требует право audit.view.
      security:
        - bearerAuth: []
      x-permission: audit.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: event
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по типу события
        - name: entityType
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по типу сущности
        - name: entityId
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по ID сущности
        - name: userId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по ID пользователя
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по источнику
        - name: relatedOrderId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по связанному заказу
        - name: relatedClientId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по связанному клиенту
        - name: relatedPaymentId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по связанному платежу
        - name: relatedDeadlineId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по связанному дедлайну
        - name: relatedProductionEventId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по связанному производственному событию
        - name: requestId
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по request/correlation ID
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Фильтр по дате создания (от)
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Фильтр по дате создания (до)
      responses:
        '200':
          description: Список audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/audit/filter-options:
    get:
      tags:
        - Audit
      operationId: getAuditFilterOptions
      summary: Значения фильтров audit
      description: Возвращает distinct-значения для выпадающих списков фильтров журнала аудита. Требует право audit.view.
      security:
        - bearerAuth: []
      x-permission: audit.view
      responses:
        '200':
          description: Значения фильтров audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditFilterOptionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: authLogin
      summary: Логин пользователя
      description: |
        Проверяет логин и пароль, возвращает short-lived access token и выставляет
        refresh token в HttpOnly cookie. Refresh token не возвращается в response body.
      x-rate-limit: login_by_ip_and_username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  username: manager
                  password: password123
      responses:
        '200':
          description: Успешный логин
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: authRefresh
      summary: Обновление access token
      description: |
        Использует refresh token из HttpOnly cookie. При успешном refresh выполняется
        rotation refresh token'а: старый token атомарно отзывается, новый выставляется
        в HttpOnly cookie.
      security:
        - refreshCookie: []
      x-rate-limit: refresh_by_session
      responses:
        '200':
          description: Новый access token и актуальный пользователь
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: authLogout
      summary: Logout пользователя
      description: |
        Отзывает текущий refresh token, очищает refresh cookie. Endpoint должен быть
        идемпотентным: повторный logout не должен падать.
      responses:
        '200':
          description: Сессия завершена
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/workos/authorize:
    get:
      tags:
        - Auth
      operationId: authWorkosAuthorize
      summary: Получить hosted SSO login URL (WorkOS AuthKit)
      description: |
        Выдаёт authorize URL hosted-провайдера и выставляет одноразовый
        HMAC-подписанный state в HttpOnly cookie (mode=login). Доступен только
        при включённом BACKEND_ENABLE_WORKOS_AUTH, иначе 503.
      x-rate-limit: auth_workos_authorize
      responses:
        '200':
          description: AuthKit authorize URL
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkosAuthorizeResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/workos/callback:
    post:
      tags:
        - Auth
      operationId: authWorkosCallback
      summary: Обменять SSO code на ERP-сессию
      description: |
        Проверяет state против HttpOnly cookie (mode=login), обменивает
        одноразовый code у WorkOS и выдаёт обычную ERP-сессию (access token +
        refresh cookie). Логин возможен только для уже слинкованной identity;
        авто-создания юзеров и auto-link по email нет.
      x-rate-limit: auth_workos_callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkosCallbackRequest'
      responses:
        '200':
          description: Успешный SSO-логин
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/workos/link/start:
    post:
      tags:
        - Auth
      operationId: authWorkosLinkStart
      summary: Начать привязку текущего юзера к SSO
      description: |
        Из живой сессии (bearer) выдаёт authorize URL с state mode=link,
        привязанным к текущей sessionId. Callback перепроверяет живую сессию.
      security:
        - bearerAuth: []
      x-rate-limit: auth_workos_link_start
      responses:
        '200':
          description: AuthKit link URL
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkosAuthorizeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/workos/link/callback:
    post:
      tags:
        - Auth
      operationId: authWorkosLinkCallback
      summary: Завершить привязку текущего юзера к SSO
      description: |
        Требует живой bearer-сессии, совпадения state.sessionId с текущей
        сессией и verified email у identity. Identity прикрепляется к юзеру
        текущей сессии (не по email). Sub, занятый другим юзером → 409.
      security:
        - bearerAuth: []
      x-rate-limit: auth_workos_callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkosCallbackRequest'
      responses:
        '200':
          description: Identity привязана
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkosLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/workos/links:
    get:
      tags:
        - Auth
      operationId: authWorkosListLinks
      summary: Список SSO identity, привязанных к текущему юзеру
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список привязанных identity
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkosLinkListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/workos/links/{identityId}:
    delete:
      tags:
        - Auth
      operationId: authWorkosUnlinkOne
      summary: Отвязать одну SSO identity от текущего юзера
      description: |
        Требует подтверждения паролем. При login_policy='external' отвязка
        запрещена (409) — юзер не может запереть себя без альтернативного
        способа входа.
      security:
        - bearerAuth: []
      x-rate-limit: auth_workos_unlink
      parameters:
        - name: identityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkosUnlinkRequest'
      responses:
        '200':
          description: Identity отвязана
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkosUnlinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/workos/admin/users/{userId}/links:
    get:
      tags:
        - Auth
      operationId: authWorkosAdminListLinks
      summary: Список SSO identity, привязанных к юзеру
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Список привязанных identity у юзера
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkosLinkListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/workos/admin/users/{userId}/links/{identityId}:
    delete:
      tags:
        - Auth
      operationId: authWorkosAdminUnlinkOne
      summary: Отвязать одну SSO identity от юзера
      security:
        - bearerAuth: []
      x-rate-limit: auth_workos_admin_unlink
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: identityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkosAdminUnlinkRequest'
      responses:
        '200':
          description: Identity отвязана администратором
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkosUnlinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Получить текущего пользователя
      description: Возвращает текущего пользователя, роль и список permissions.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий пользователь
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/preferences:
    get:
      tags:
        - Auth
      operationId: getCurrentUserPreferences
      summary: Получить настройки текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Настройки текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Auth
      operationId: updateCurrentUserPreferences
      summary: Обновить настройки текущего пользователя
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: Обновлённые настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/me/preferences/reference-usage:
    post:
      tags:
        - Auth
      operationId: promoteCurrentUserReferenceUsage
      summary: Запомнить использование записи справочника текущим пользователем
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceUsageRequest'
      responses:
        '200':
          description: Настройки с обновлённой историей использования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/orders:
    get:
      tags:
        - Orders
      operationId: listOrders
      summary: Список заказов
      description: |
        Возвращает серверно-пагинированный список заказов. Backend применяет permissions,
        scope пользователя, whitelist допустимых sort/filter полей и не принимает raw SQL/GraphQL поля от frontend.
      security:
        - bearerAuth: []
      x-permission: orders.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          required: false
          description: Whitelisted поле сортировки.
          schema:
            type: string
            enum:
              - orderId
              - orderName
              - orderDate
              - plannedCompletionDate
              - completionDate
              - issueDate
              - deletedAt
              - projectCode
              - clientName
              - orderStatusName
              - paymentStatusName
              - productionStatusName
              - finalAmount
              - paidAmount
              - debtAmount
              - updatedAt
            default: updatedAt
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: search
          in: query
          required: false
          description: Поиск по номеру/названию заказа, клиенту и разрешённым текстовым полям.
          schema:
            type: string
            maxLength: 200
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: orderStatusId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: paymentStatusId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: productionStatusId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: onlyMyOrders
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: deleted
          in: query
          required: false
          description: true — только удалённые заказы; требует orders.delete.
          schema:
            type: boolean
        - name: groupIds
          in: query
          required: false
          description: Comma-separated current group UUID filters.
          schema:
            type: string
        - name: groupMode
          in: query
          required: false
          description: Current group filter mode.
          schema:
            type: string
            enum: [any, all, primary, none]
            default: any
      responses:
        '200':
          description: Список заказов
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Создать заказ
      description: |
        Создаёт заказ и все дочерние сущности в одной БД-транзакции. Backend считает
        финансовые итоги и возвращает полный актуальный OrderDto.
      security:
        - bearerAuth: []
      x-permissions:
        - orders.create
        - orders.view_financials
      x-transactional: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveOrderDto'
      responses:
        '201':
          description: Заказ создан
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate order name (ORDER_NAME_DUPLICATE with suggestedOrderName)
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/status-board:
    get:
      tags:
        - Orders
      operationId: getOrderStatusBoard
      summary: Получить доску статусов заказов
      description: |
        Возвращает независимую проекцию общих или производственных статусов.
        Начальный запрос содержит первую ограниченную страницу каждой колонки;
        последующие страницы одной колонки используют opaque keyset cursor.
      security:
        - bearerAuth: []
      x-permission: orders.view
      parameters:
        - name: board
          in: query
          required: true
          schema:
            type: string
            enum: [order, production]
        - name: column
          in: query
          required: false
          description: ID статуса или virtual key `unassigned` для production.
          schema:
            type: string
            pattern: '^(unassigned|[1-9][0-9]*)$'
        - name: cursor
          in: query
          required: false
          description: Opaque cursor; требует параметр column.
          schema:
            type: string
            maxLength: 2000
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 24
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: onlyMyOrders
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: overdueOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeDone
          in: query
          required: false
          description: Показывать статус Done и его заказы; только для production.
          schema:
            type: boolean
            default: false
        - name: plannedFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: plannedTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: orderIds
          in: query
          required: false
          description: CSV-список ID заказов для точечной проекции доски.
          schema:
            type: string
            pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$'
      responses:
        '200':
          description: Доска статусов
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusBoardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/orders/resource-demands:
    get:
