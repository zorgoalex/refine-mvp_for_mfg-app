      summary: Learn confirmed structural Basis PDF table layout
      security:
        - bearerAuth: []
      x-permission: orders.import
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature, mapping]
              properties:
                signature: { type: object, additionalProperties: true }
                mapping: { type: object, additionalProperties: true }
      responses:
        '201': { description: Learned or replayed pattern }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Pattern or idempotency conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/FeatureDisabled' }

