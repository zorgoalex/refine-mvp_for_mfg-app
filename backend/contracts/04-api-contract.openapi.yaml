components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token из /api/v1/auth/login или /api/v1/auth/refresh.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh token cookie. Не доступен frontend JavaScript-коду.

  headers:
    RequestId:
      description: Уникальный id запроса для логов и аудита.
      schema:
        type: string
        example: req_01HZX8K5T3M2F5F7K9A2S1QW3E

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderDetailId:
      name: detailId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BazisCutSetId:
      name: setId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    BazisCutSetDetailId:
      name: detailId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ команды для безопасного retry без повторного удаления/audit/outbox.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        example: order-delete:01HZX8K5T3M2F5F7K9A2S1QW3E
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: Текущая версия заказа для optimistic locking. Допускается число или quoted ETag вида `"4"`.
      schema:
        type: string
        example: '"4"'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PhoneId:
      name: phoneId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProductionStatusId:
      name: productionStatusId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DeadlineId:
      name: deadlineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некорректные path/query/header параметры
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            badRequest:
              value:
                error:
                  code: BAD_REQUEST
                  message: Некорректные входные данные
                  details:
                    header: If-Match
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            authRequired:
              value:
                error:
                  code: AUTH_REQUIRED
                  message: Требуется авторизация
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            permissionDenied:
              value:
                error:
                  code: PERMISSION_DENIED
                  message: Недостаточно прав для выполнения действия
                  details:
                    requiredPermission: orders.update
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    ServiceUnavailable:
      description: Feature is disabled or service dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            disabled:
              value:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Feature is disabled
                  details:
                    feature: groups
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    OrderNotFound:
      description: Заказ не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            notFound:
              value:
                error:
                  code: ORDER_NOT_FOUND
                  message: Заказ не найден
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    UserNotFound:
      description: Пользователь не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            notFound:
              value:
                error:
                  code: USER_NOT_FOUND
                  message: Пользователь не найден
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    UploadNotFound:
      description: Загрузка не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            notFound:
              value:
                error:
                  code: UPLOAD_NOT_FOUND
                  message: Загруженный файл не найден
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    UserAlreadyExists:
      description: Пользователь с таким username/email уже существует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            exists:
              value:
                error:
                  code: USER_ALREADY_EXISTS
                  message: Пользователь с таким username уже существует
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    OrderVersionConflict:
      description: Конфликт версии заказа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            versionConflict:
              value:
                error:
                  code: ORDER_VERSION_CONFLICT
                  message: Заказ был изменён другим пользователем
                  details:
                    currentVersion: 8
                    clientVersion: 7
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    IdempotencyConflict:
      description: Конфликт idempotency key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            idempotencyKeyReused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: Idempotency key was reused with a different request
                  details:
                    idempotencyKey: detail-production-stage:01HZX8K5T3M2F5F7K9A2S1QW3E
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    ClientPhoneConflict:
      description: Конфликт телефона клиента, refKey или idempotency key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            duplicatePhone:
              value:
                error:
                  code: CLIENT_PHONE_DUPLICATE
                  message: Client phone already exists
                  details:
                    clientId: 123
                    phoneNumber: '+15551234567'
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
            duplicateRefKey:
              value:
                error:
                  code: CLIENT_PHONE_REF_KEY_DUPLICATE
                  message: Client phone 1C reference already exists
                  details:
                    refKey1c: 4f1dd294-8016-4b1c-a53c-bcae02d88c91
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
            clientChangeUnsupported:
              value:
                error:
                  code: CLIENT_PHONE_CLIENT_CHANGE_UNSUPPORTED
                  message: Changing client for a phone is not supported
                  details:
                    phoneId: 45
                    currentClientId: 123
                    requestedClientId: 456
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
            idempotencyKeyReused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: Idempotency key was reused with a different request
                  details:
                    idempotencyKey: client-phone:01HZX8K5T3M2F5F7K9A2S1QW3E
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
            idempotencyInProgress:
              value:
                error:
                  code: IDEMPOTENCY_IN_PROGRESS
                  message: Idempotent command is still processing
                  details:
                    idempotencyKey: client-phone:01HZX8K5T3M2F5F7K9A2S1QW3E
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
            idempotencyFailed:
              value:
                error:
                  code: IDEMPOTENCY_FAILED
                  message: Idempotent command previously failed
                  details:
                    idempotencyKey: client-phone:01HZX8K5T3M2F5F7K9A2S1QW3E
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    ValidationError:
      description: Ошибка валидации payload/query params
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Некорректные входные данные
                  details:
                    fields:
                      - path: header.clientId
                        message: clientId обязателен
                      - path: details.0.quantity
                        message: quantity должен быть больше 0
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    RateLimitExceeded:
      description: Превышен лимит запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            rateLimit:
              value:
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Превышен лимит запросов
                  details:
                    retryAfterSeconds: 60
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    PayloadTooLarge:
      description: Слишком большой payload или файл
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            tooLarge:
              value:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: Файл превышает допустимый размер
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    UnsupportedMediaType:
      description: Неподдерживаемый тип файла
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            unsupported:
              value:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: Неподдерживаемый тип файла
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    FeatureDisabled:
      description: API feature выключена конфигурацией runtime
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            featureDisabled:
              value:
                code: SERVICE_UNAVAILABLE
                message: API feature is disabled
                details:
                  feature: deadlines
                requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    NotFound:
      description: Запрашиваемый ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            notFound:
              value:
                code: SHEET_MATERIAL_NOT_FOUND
                message: Sheet material type not found
                requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    Conflict:
      description: Конфликт версии или уникальности
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            conflict:
              value:
                code: SHEET_MATERIAL_STALE_VERSION
                message: Sheet material type version mismatch
                requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            internal:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E

  schemas:
    CreateBazisCutSetRequest:
      type: object
      additionalProperties: false
      required: [name, orderId, detailIds]
      properties:
