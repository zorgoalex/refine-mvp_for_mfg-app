  /api/v1/cut-jobs/{cutJobId}/groups/{groupId}/sheets/{sheetIndex}.png:
    get:
      tags:
        - CutJobs
      operationId: renderCutSheetPng
      summary: Render a per-sheet PNG
      security:
        - bearerAuth: []
      x-permission: cut.view
      parameters:
        - name: variant
          in: query
          required: false
          schema:
            type: string
            enum: [auto, manual, active]
            default: auto
          description: Which layout variant to render (auto = algorithm layout, manual = saved manual layout, active = whichever is marked active). Default auto.
        - name: renderVersion
          in: query
          required: false
          schema:
            type: string
          description: Opaque cache-bust token; ignored by the server but forwarded by the browser to bypass stale cached responses after a manual layout is saved.
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Conflict: manual layout unavailable (CUT_MANUAL_LAYOUT_UNAVAILABLE — variant=manual
            requested but no non-stale manual layout exists for this group), or a recalculation
            is required before rendering (CUT_RECALC_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/FeatureDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

