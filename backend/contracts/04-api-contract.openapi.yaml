  /api/v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags:
        - Orders
      operationId: getOrderById
      summary: Получить заказ
      description: Возвращает полный заказ для show/edit формы.
      security:
        - bearerAuth: []
      x-permission: orders.view
      parameters:
        - name: includeDeleted
          in: query
          required: false
          description: true — разрешить чтение удалённого заказа; требует orders.delete.
          schema:
            type: boolean
      responses:
        '200':
          description: Полный заказ
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - Orders
      operationId: updateOrder
      summary: Обновить заказ
      description: |
        Обновляет заказ и все дочерние сущности в одной БД-транзакции. Обязательна
        проверка optimistic locking через поле version.
      security:
        - bearerAuth: []
      x-permissions:
        - orders.update
        - orders.view_financials
      x-transactional: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveOrderDto'
      responses:
        '200':
          description: Заказ обновлён
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderVersionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - Orders
      operationId: deleteOrder
      summary: Удалить или архивировать заказ
      description: |
        Выполняет soft-delete/archive заказа, а не физическое удаление.
        Команда stale-safe: клиент обязан передать текущую версию заказа в
        `If-Match`, а retry-safe поведение обеспечивается `Idempotency-Key`.
      security:
        - bearerAuth: []
      x-permission: orders.delete
      x-transactional: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: Заказ удалён/архивирован
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: Версия заказа устарела или idempotency key уже используется другим запросом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                versionConflict:
                  value:
                    error:
                      code: ORDER_VERSION_CONFLICT
                      message: Заказ был изменён другим пользователем
                      details:
                        currentVersion: 8
                        clientVersion: 7
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
                idempotencyKeyReused:
                  value:
                    error:
                      code: IDEMPOTENCY_KEY_REUSED
                      message: Idempotency key was reused with a different request
                      details:
                        idempotencyKey: order-delete:01HZX8K5T3M2F5F7K9A2S1QW3E
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
                idempotencyInProgress:
                  value:
                    error:
                      code: IDEMPOTENCY_IN_PROGRESS
                      message: Idempotent command is still processing
                      details:
                        idempotencyKey: order-delete:01HZX8K5T3M2F5F7K9A2S1QW3E
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
                idempotencyFailed:
                  value:
                    error:
                      code: IDEMPOTENCY_FAILED
                      message: Idempotent command previously failed
                      details:
                        idempotencyKey: order-delete:01HZX8K5T3M2F5F7K9A2S1QW3E
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}/restore:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags:
        - Orders
      operationId: restoreOrder
      summary: Восстановить удалённый заказ
      description: |
        Восстанавливает мягко удалённый заказ.
        Команда stale-safe: клиент обязан передать текущую версию заказа в
        `If-Match`, а retry-safe поведение обеспечивается `Idempotency-Key`.
      security:
        - bearerAuth: []
      x-permission: orders.delete
      x-transactional: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                orderName:
                  type: string
      responses:
        '200':
          description: Заказ восстановлен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: ORDER_VERSION_CONFLICT, ORDER_NOT_DELETED, ORDER_NAME_DUPLICATE или ORDER_RESTORE_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                versionConflict:
                  value:
                    error:
                      code: ORDER_VERSION_CONFLICT
                      message: Заказ был изменён другим пользователем
                      details:
                        currentVersion: 8
                        clientVersion: 7
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
                orderNotDeleted:
                  value:
                    error:
                      code: ORDER_NOT_DELETED
                      message: Заказ не удалён
                      details:
                        orderId: 42
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
                orderNameDuplicate:
                  value:
                    error:
                      code: ORDER_NAME_DUPLICATE
                      message: Номер заказа «2561» уже занят заказом #77
                      details:
                        existingOrderId: 77
                        orderName: '2561'
                        suggestedOrderName: '2562'
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
                restoreConflict:
                  value:
                    error:
                      code: ORDER_RESTORE_CONFLICT
                      message: Конкурентное изменение помешало восстановлению, повторите попытку
                      details:
                        orderId: 42
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

