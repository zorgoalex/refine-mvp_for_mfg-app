openapi: 3.0.3
info:
  title: ERP/CRM Backend API
  version: 0.1.0
  description: |
    Контракт backend API для первого этапа внедрения NestJS backend-слоя.

    Backend является источником истины для авторизации, прав доступа, транзакционного
    сохранения заказов, финансовых расчётов, экспорта, VLM-интеграций и аудита.

    Frontend не должен напрямую управлять транзакциями заказа, refresh-token'ами,
    финансовыми итогами, экспортными payload'ами и проверкой прав доступа.

    Stage-1 backend API использует явное path versioning. Текущая стабильная
    версия: /api/v1. Неломающие поля можно добавлять в v1; breaking changes
    требуют /api/v2 и отдельного cutover/deprecation плана.

servers:
  - url: http://localhost:3000
    description: Local NestJS backend
  - url: https://api.example.com
    description: Production backend placeholder

tags:
  - name: Audit
    description: Журнал аудита событий системы
  - name: Auth
    description: Авторизация, refresh-сессии и текущий пользователь
  - name: Orders
    description: Заказы как бизнес-агрегат
  - name: Order Export
    description: Экспорт заказов во внешние системы
  - name: Payments
    description: Платежи заказа
  - name: Client Phones
    description: Телефоны клиентов
  - name: Production Actions
    description: Точечные производственные действия над заказом
  - name: Projects
    description: Projects API
  - name: Order Snapshots
    description: Экспорт и импорт переносимых snapshot'ов заказа
  - name: Deadlines
    description: Дедлайны, политики дедлайнов и настройки deadline automation
  - name: Notifications
    description: Persisted current-user notifications
  - name: Users
    description: Управление пользователями
  - name: VLM
    description: Загрузка изображений и VLM-анализ
  - name: Health
    description: Liveness/readiness проверки backend-сервиса

paths:
  /api/v1/audit:
    get:
      tags:
        - Audit
      operationId: listAuditLog
      summary: Список audit events
      description: Возвращает постраничный список audit log событий с фильтрами по actor, entity, related ids, action и времени. Требует право audit.view.
      security:
        - bearerAuth: []
      x-permission: audit.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: event
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по типу события
        - name: entityType
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по типу сущности
        - name: entityId
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по ID сущности
        - name: userId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по ID пользователя
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по источнику
        - name: relatedOrderId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по связанному заказу
        - name: relatedClientId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по связанному клиенту
        - name: relatedPaymentId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по связанному платежу
        - name: relatedDeadlineId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по связанному дедлайну
        - name: relatedProductionEventId
          in: query
          required: false
          schema:
            type: integer
          description: Фильтр по связанному производственному событию
        - name: requestId
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по request/correlation ID
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Фильтр по дате создания (от)
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Фильтр по дате создания (до)
      responses:
        '200':
          description: Список audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: authLogin
      summary: Логин пользователя
      description: |
        Проверяет логин и пароль, возвращает short-lived access token и выставляет
        refresh token в HttpOnly cookie. Refresh token не возвращается в response body.
      x-rate-limit: login_by_ip_and_username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  username: manager
                  password: password123
      responses:
        '200':
          description: Успешный логин
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: authRefresh
      summary: Обновление access token
      description: |
        Использует refresh token из HttpOnly cookie. При успешном refresh выполняется
        rotation refresh token'а: старый token атомарно отзывается, новый выставляется
        в HttpOnly cookie.
      security:
        - refreshCookie: []
      x-rate-limit: refresh_by_session
      responses:
        '200':
          description: Новый access token и актуальный пользователь
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: authLogout
      summary: Logout пользователя
      description: |
        Отзывает текущий refresh token, очищает refresh cookie. Endpoint должен быть
        идемпотентным: повторный logout не должен падать.
      responses:
        '200':
          description: Сессия завершена
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Получить текущего пользователя
      description: Возвращает текущего пользователя, роль и список permissions.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий пользователь
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders:
    get:
      tags:
        - Orders
      operationId: listOrders
      summary: Список заказов
      description: |
        Возвращает серверно-пагинированный список заказов. Backend применяет permissions,
        scope пользователя, whitelist допустимых sort/filter полей и не принимает raw SQL/GraphQL поля от frontend.
      security:
        - bearerAuth: []
      x-permission: orders.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          required: false
          description: Whitelisted поле сортировки.
          schema:
            type: string
            enum:
              - orderId
              - orderName
              - orderDate
              - plannedCompletionDate
              - completionDate
              - issueDate
              - clientName
              - orderStatusName
              - paymentStatusName
              - productionStatusName
              - finalAmount
              - paidAmount
              - debtAmount
              - updatedAt
            default: updatedAt
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: search
          in: query
          required: false
          description: Поиск по номеру/названию заказа, клиенту и разрешённым текстовым полям.
          schema:
            type: string
            maxLength: 200
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: orderStatusId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: paymentStatusId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: productionStatusId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: onlyMyOrders
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: projectIds
          in: query
          required: false
          description: Comma-separated current project UUID filters.
          schema:
            type: string
        - name: projectMode
          in: query
          required: false
          description: Current project filter mode.
          schema:
            type: string
            enum: [any, all, primary, none]
            default: any
      responses:
        '200':
          description: Список заказов
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Создать заказ
      description: |
        Создаёт заказ и все дочерние сущности в одной БД-транзакции. Backend считает
        финансовые итоги и возвращает полный актуальный OrderDto.
      security:
        - bearerAuth: []
      x-permissions:
        - orders.create
        - orders.view_financials
      x-transactional: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveOrderDto'
      responses:
        '201':
          description: Заказ создан
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/form-data:
    get:
      tags:
        - Orders
      operationId: getOrderFormData
      summary: Справочные данные для формы заказа
      description: |
        Возвращает набор справочников, необходимый для формы заказа, чтобы сократить
        количество мелких запросов frontend'а.
      security:
        - bearerAuth: []
      x-permission: orders.view
      responses:
        '200':
          description: Справочники формы заказа
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFormDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags:
        - Orders
      operationId: getOrderById
      summary: Получить заказ
      description: Возвращает полный заказ для show/edit формы.
      security:
        - bearerAuth: []
      x-permission: orders.view
      responses:
        '200':
          description: Полный заказ
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - Orders
      operationId: updateOrder
      summary: Обновить заказ
      description: |
        Обновляет заказ и все дочерние сущности в одной БД-транзакции. Обязательна
        проверка optimistic locking через поле version.
      security:
        - bearerAuth: []
      x-permissions:
        - orders.update
        - orders.view_financials
      x-transactional: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveOrderDto'
      responses:
        '200':
          description: Заказ обновлён
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderVersionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - Orders
      operationId: deleteOrder
      summary: Удалить или архивировать заказ
      description: |
        Выполняет soft-delete/archive заказа, а не физическое удаление.
        Команда stale-safe: клиент обязан передать текущую версию заказа в
        `If-Match`, а retry-safe поведение обеспечивается `Idempotency-Key`.
      security:
        - bearerAuth: []
      x-permission: orders.delete
      x-transactional: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: Заказ удалён/архивирован
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: Версия заказа устарела или idempotency key уже используется другим запросом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                versionConflict:
                  value:
                    error:
                      code: ORDER_VERSION_CONFLICT
                      message: Заказ был изменён другим пользователем
                      details:
                        currentVersion: 8
                        clientVersion: 7
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
                idempotencyKeyReused:
                  value:
                    error:
                      code: IDEMPOTENCY_KEY_REUSED
                      message: Idempotency key was reused with a different request
                      details:
                        idempotencyKey: order-delete:01HZX8K5T3M2F5F7K9A2S1QW3E
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
                idempotencyInProgress:
                  value:
                    error:
                      code: IDEMPOTENCY_IN_PROGRESS
                      message: Idempotent command is still processing
                      details:
                        idempotencyKey: order-delete:01HZX8K5T3M2F5F7K9A2S1QW3E
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
                idempotencyFailed:
                  value:
                    error:
                      code: IDEMPOTENCY_FAILED
                      message: Idempotent command previously failed
                      details:
                        idempotencyKey: order-delete:01HZX8K5T3M2F5F7K9A2S1QW3E
                      requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}/projects:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags:
        - Orders
      operationId: getOrderProjects
      summary: Получить текущие проекты заказа
      description: Возвращает только текущие Project ↔ Order links.
      security:
        - bearerAuth: []
      x-permission: orders.view or projects.view
      responses:
        '200':
          description: Текущие проекты заказа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProjectsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Orders
      operationId: replaceOrderProjects
      summary: Заменить текущие проекты заказа
      description: |
        Stale-safe и retry-safe replace текущих связей заказа с проектами.
        Использует command_idempotency_keys с command_name=projects.order_links.replace.
      security:
        - bearerAuth: []
      x-permission: projects.manage_links
      x-transactional: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceOrderProjectsRequest'
      responses:
        '200':
          description: Проекты заказа заменены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceOrderProjectsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderVersionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    patch:
      tags:
        - Production Actions
      operationId: changeOrderStatus
      summary: Изменить статус заказа
      description: Изменяет статус заказа с записью audit event и stale-safe проверкой version.
      security:
        - bearerAuth: []
      x-permissions:
        - orders.change_status
        - orders.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderStatusRequest'
      responses:
        '200':
          description: Статус изменён
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderVersionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/FeatureDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}/payment-status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    patch:
      tags:
        - Production Actions
      operationId: changePaymentStatus
      summary: Изменить статус оплаты заказа
      description: Изменяет ручной статус оплаты заказа с записью audit event и stale-safe проверкой version.
      security:
        - bearerAuth: []
      x-permissions:
        - orders.update
        - payments.update
        - orders.view_financials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePaymentStatusRequest'
      responses:
        '200':
          description: Статус оплаты изменён
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderVersionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/FeatureDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}/production-status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    patch:
      tags:
        - Production Actions
      operationId: changeProductionStatus
      summary: Изменить текущий производственный статус заказа
      description: Изменяет текущий производственный статус заказа с записью audit event и stale-safe проверкой version.
      security:
