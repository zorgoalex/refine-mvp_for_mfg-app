      x-permission: bazis.manage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notes
              additionalProperties: false
              properties:
                notes:
                  type: string
                  nullable: true
                  description: >-
