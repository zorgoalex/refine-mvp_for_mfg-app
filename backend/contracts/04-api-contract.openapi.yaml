          $ref: '#/components/responses/InternalError'

    patch:
      tags:
        - Users
      operationId: updateUser
      summary: Обновить пользователя
      security:
        - bearerAuth: []
      x-permission: users.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/UserAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{userId}/change-password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags:
        - Users
      operationId: changeUserPassword
      summary: Сменить пароль пользователя
      security:
        - bearerAuth: []
      x-permission: users.change_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Пароль изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{userId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags:
        - Users
      operationId: deactivateUser
      summary: Деактивировать пользователя
      security:
        - bearerAuth: []
      x-permission: users.deactivate
      responses:
        '200':
          description: Пользователь деактивирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{userId}/activate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags:
        - Users
      operationId: activateUser
      summary: Активировать пользователя
      security:
        - bearerAuth: []
      x-permission: users.activate
      responses:
        '200':
          description: Пользователь активирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/vlm/health:
    get:
      tags:
        - VLM
      operationId: getVlmHealth
      summary: Проверить состояние VLM-интеграции
      description: |
        Для обычных пользователей endpoint должен возвращать только безопасный минимум.
        Расширенная диагностика доступна только пользователям с permission vlm.health.view.
      security:
        - bearerAuth: []
      x-permission: vlm.health.view
      responses:
        '200':
          description: Статус VLM-интеграции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VlmHealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/vlm/upload:
    post:
      tags:
        - VLM
      operationId: uploadVlmImage
      summary: Загрузить изображение для VLM-анализа
      description: |
        Загружает файл, проверяет размер и MIME type, создаёт запись file_uploads и
        возвращает uploadId. VLM analyze должен использовать uploadId, а не произвольный внешний URL.
      security:
        - bearerAuth: []
      x-permission: vlm.use
      x-rate-limit: vlm_upload_by_user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Изображение для анализа.
                purpose:
                  type: string
                  default: vlm
                  enum:
                    - vlm
                    - order_file
      responses:
        '201':
          description: Файл загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VlmUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          description: Ошибка upstream VLM provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '503':
          $ref: '#/components/responses/FeatureDisabled'
        '504':
          description: Timeout upstream VLM provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/vlm/analyze:
    post:
      tags:
        - VLM
      operationId: analyzeVlmImage
      summary: Выполнить VLM-анализ изображения
      description: |
        Выполняет анализ ранее загруженного изображения. На первом этапе рекомендуется
        требовать uploadId. Поле imageUrl допускается только для URL, принадлежащих ранее загруженным файлам.
      security:
        - bearerAuth: []
      x-permission: vlm.use
      x-rate-limit: vlm_analyze_by_user_daily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VlmAnalyzeRequest'
      responses:
        '200':
          description: Результат анализа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VlmAnalyzeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          description: Ошибка upstream VLM provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '503':
          $ref: '#/components/responses/FeatureDisabled'
        '504':
          description: Timeout upstream VLM provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /health/live:
    get:
      tags:
        - Health
      operationId: liveHealth
      summary: Liveness probe
      description: Проверяет, что процесс backend жив.
      responses:
        '200':
          description: Backend process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveHealthResponse'

  /health/ready:
    get:
      tags:
        - Health
      operationId: readyHealth
      summary: Readiness probe
      description: "Проверяет готовность backend обрабатывать запросы: БД, Redis и обязательные интеграции."
      responses:
        '200':
          description: Backend готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyHealthResponse'
        '503':
          description: Backend не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyHealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token из /api/v1/auth/login или /api/v1/auth/refresh.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh token cookie. Не доступен frontend JavaScript-коду.

  headers:
    RequestId:
      description: Уникальный id запроса для логов и аудита.
      schema:
        type: string
        example: req_01HZX8K5T3M2F5F7K9A2S1QW3E

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderDetailId:
      name: detailId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ команды для безопасного retry без повторного удаления/audit/outbox.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        example: order-delete:01HZX8K5T3M2F5F7K9A2S1QW3E
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: Текущая версия заказа для optimistic locking. Допускается число или quoted ETag вида `"4"`.
      schema:
        type: string
        example: '"4"'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PhoneId:
      name: phoneId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProductionStatusId:
      name: productionStatusId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DeadlineId:
      name: deadlineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некорректные path/query/header параметры
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            badRequest:
              value:
                error:
                  code: BAD_REQUEST
                  message: Некорректные входные данные
                  details:
                    header: If-Match
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            authRequired:
              value:
                error:
                  code: AUTH_REQUIRED
                  message: Требуется авторизация
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            permissionDenied:
              value:
                error:
                  code: PERMISSION_DENIED
                  message: Недостаточно прав для выполнения действия
                  details:
                    requiredPermission: orders.update
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    ServiceUnavailable:
      description: Feature is disabled or service dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            disabled:
              value:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Feature is disabled
                  details:
                    feature: projects
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    OrderNotFound:
      description: Заказ не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            notFound:
              value:
                error:
                  code: ORDER_NOT_FOUND
                  message: Заказ не найден
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    UserNotFound:
      description: Пользователь не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            notFound:
              value:
                error:
                  code: USER_NOT_FOUND
                  message: Пользователь не найден
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    UploadNotFound:
      description: Загрузка не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            notFound:
              value:
                error:
                  code: UPLOAD_NOT_FOUND
                  message: Загруженный файл не найден
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    UserAlreadyExists:
      description: Пользователь с таким username/email уже существует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            exists:
              value:
                error:
                  code: USER_ALREADY_EXISTS
                  message: Пользователь с таким username уже существует
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    OrderVersionConflict:
      description: Конфликт версии заказа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            versionConflict:
              value:
                error:
                  code: ORDER_VERSION_CONFLICT
                  message: Заказ был изменён другим пользователем
                  details:
                    currentVersion: 8
                    clientVersion: 7
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    IdempotencyConflict:
      description: Конфликт idempotency key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            idempotencyKeyReused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: Idempotency key was reused with a different request
                  details:
                    idempotencyKey: detail-production-stage:01HZX8K5T3M2F5F7K9A2S1QW3E
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    ClientPhoneConflict:
      description: Конфликт телефона клиента, refKey или idempotency key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            duplicatePhone:
              value:
                error:
                  code: CLIENT_PHONE_DUPLICATE
                  message: Client phone already exists
                  details:
                    clientId: 123
                    phoneNumber: '+15551234567'
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
            duplicateRefKey:
              value:
                error:
                  code: CLIENT_PHONE_REF_KEY_DUPLICATE
                  message: Client phone 1C reference already exists
                  details:
                    refKey1c: 4f1dd294-8016-4b1c-a53c-bcae02d88c91
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
            clientChangeUnsupported:
              value:
                error:
                  code: CLIENT_PHONE_CLIENT_CHANGE_UNSUPPORTED
                  message: Changing client for a phone is not supported
                  details:
                    phoneId: 45
                    currentClientId: 123
                    requestedClientId: 456
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
            idempotencyKeyReused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: Idempotency key was reused with a different request
                  details:
                    idempotencyKey: client-phone:01HZX8K5T3M2F5F7K9A2S1QW3E
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
            idempotencyInProgress:
              value:
                error:
                  code: IDEMPOTENCY_IN_PROGRESS
                  message: Idempotent command is still processing
                  details:
                    idempotencyKey: client-phone:01HZX8K5T3M2F5F7K9A2S1QW3E
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
            idempotencyFailed:
              value:
                error:
                  code: IDEMPOTENCY_FAILED
                  message: Idempotent command previously failed
                  details:
                    idempotencyKey: client-phone:01HZX8K5T3M2F5F7K9A2S1QW3E
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    ValidationError:
      description: Ошибка валидации payload/query params
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Некорректные входные данные
                  details:
                    fields:
                      - path: header.clientId
                        message: clientId обязателен
                      - path: details.0.quantity
                        message: quantity должен быть больше 0
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    RateLimitExceeded:
      description: Превышен лимит запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            rateLimit:
              value:
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Превышен лимит запросов
                  details:
                    retryAfterSeconds: 60
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    PayloadTooLarge:
      description: Слишком большой payload или файл
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            tooLarge:
              value:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: Файл превышает допустимый размер
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    UnsupportedMediaType:
      description: Неподдерживаемый тип файла
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            unsupported:
              value:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: Неподдерживаемый тип файла
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    FeatureDisabled:
      description: API feature выключена конфигурацией runtime
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            featureDisabled:
              value:
                code: SERVICE_UNAVAILABLE
                message: API feature is disabled
                details:
                  feature: deadlines
                requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            internal:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
                  requestId: req_01HZX8K5T3M2F5F7K9A2S1QW3E

  schemas:
    ApiErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Некорректные входные данные
        details:
          nullable: true
          description: Дополнительные сведения об ошибке. Не должен содержать secrets.
        requestId:
          type: string
          example: req_01HZX8K5T3M2F5F7K9A2S1QW3E

    UserRole:
      type: string
      enum:
        - superadmin
        - admin
        - manager
        - top_manager
        - operator
        - worker
        - viewer

    PermissionName:
      type: string
      enum:
        - orders.view
        - orders.create
        - orders.update
        - orders.delete
        - orders.export
        - orders.change_status
        - orders.change_production_status
        - orders.view_financials
        - orders.view_audit
        - payments.view
        - payments.create
        - payments.update
        - payments.delete
        - finance.view
        - finance.analytics.view
        - clients.view
        - clients.create
        - clients.update
        - clients.delete
        - calendar.view
        - users.view
        - users.create
        - users.update
        - users.change_password
        - users.deactivate
        - users.activate
        - references.view
        - references.manage
        - analytics.view
        - vlm.use
        - vlm.configure
        - deadlines.view
        - deadlines.manage
        - deadlines.override
        - deadlines.pause
        - deadlines.cancel
        - deadlines.actions.manage
        - deadlines.manage_order_overrides
        - deadlines.audit.view
        - deadlines.worker.manage
        - deadlines.worker.schedule
        - projects.view
        - projects.create
        - projects.update
        - projects.archive
        - projects.manage_links
        - projects.view_history
        - projects.members.view
        - projects.members.manage
        - settings.view
        - settings.manage

    AuthUser:
      type: object
      required:
        - id
        - username
        - role
        - permissions
      properties:
        id:
          type: integer
          format: int64
          example: 42
        username:
          type: string
          example: manager
        email:
          type: string
          format: email
          nullable: true
          example: manager@example.com
        fullName:
          type: string
          nullable: true
          example: Иван Иванов
        role:
          $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionName'
        employeeId:
          type: integer
          format: int64
          nullable: true
        isActive:
          type: boolean
          example: true

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
